<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ExamGuard - Secure Online Examination Proctoring System Registration">
    <title>Register | ExamGuard Portal</title>

    <!-- Link to CSS Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>
    <!-- Ambient Background Lighting -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="cyber-grid"></div>

    <main class="register-container">
        <div class="register-card">
            <!-- Brand Header -->
            <header class="brand-header">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <defs>
                            <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#4f46e5" />
                                <stop offset="50%" stop-color="#3b82f6" />
                                <stop offset="100%" stop-color="#06b6d4" />
                            </linearGradient>
                        </defs>
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </div>
                <h1 class="brand-title">Exam Guard </h1>
                <p class="brand-subtitle">Candidate Identity & Exam Registration</p>
            </header>

            {% if success %}
            <div class="alert-banner alert-success" role="alert">
                <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Registration successful! Welcome, <strong>{{ username }}</strong>.</span>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert-banner alert-danger" role="alert" style="color: #ef4444; margin-bottom: 1rem;">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Registration Form -->
            <form action="/register" method="POST" enctype="multipart/form-data" id="registerForm">
                <input type="hidden" name="photo_path" id="photo_path">
                <!-- Name Field -->
                <div class="form-group">
                    <label for="name" class="form-label">Full Name / Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="name" name="username" class="form-input" placeholder="e.g. alex_hunter"
                            required autocomplete="username">
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">Institutional / Official Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" class="form-input"
                            placeholder="student@university.edu" required autocomplete="email">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">Secure Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Min. 8 characters" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="togglePasswordBtn" title="Show/Hide Password"
                            aria-label="Toggle password visibility">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="password-strength-bar" id="strengthBar">
                        <div class="password-strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="password-hint" id="passwordHint">
                        <span id="strengthText"></span>
                    </div>
                </div>

                <!-- Candidate Camera Section (Centered Rectangular Frame) -->
                <div class="form-group">
                    <label class="form-label">Candidate Photo Verification</label>
                    <div class="photo-upload-card">

                        <!-- Rectangular video & preview frame -->
                        <div class="photo-preview-wrapper" id="photoPreviewBox">
                            <div class="camera-placeholder-state" id="photoPlaceholder">
                                <svg class="photo-placeholder-icon" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                    </path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                                <span>Camera stream will show here</span>
                            </div>
                            <video id="camera" playsinline autoplay></video>
                            <canvas id="canvas" style="display: none;"></canvas>
                            <img id="preview" alt="Captured Photo">
                        </div>

                        <!-- Action Buttons -->
                        <div class="photo-actions">
                            <button type="button" class="btn-photo-action" id="startCamera">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                    </path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                                <span>Start Camera</span>
                            </button>

                            <button type="button" class="btn-photo-action" id="capturePhoto" disabled
                                style="opacity: 0.5; cursor: not-allowed;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <span>Capture Photo</span>
                            </button>
                        </div>

                        <p class="photo-status-text" id="photoStatus">Click "Start Camera" to begin verification.</p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="registerButton" disabled
                    style="opacity: 0.5; cursor: not-allowed;">
                    <span>Complete Registration</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Footer Link -->
            <footer class="card-footer">
                Already registered? <a href="/login">Sign In here</a>
            </footer>
        </div>
    </main>

    <script>
        // Password toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const strengthBar = document.getElementById('strengthBar');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>`
                : `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>`;
        });

        // Password Strength
        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            if (!val.length) {
                strengthBar.style.display = 'none';
                strengthText.textContent = '';
                return;
            }
            strengthBar.style.display = 'block';
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            if (score <= 1) {
                strengthFill.style.width = '25%';
                strengthFill.style.backgroundColor = '#ef4444';
                strengthText.textContent = 'Weak password';
                strengthText.style.color = '#ef4444';
            } else if (score <= 3) {
                strengthFill.style.width = '65%';
                strengthFill.style.backgroundColor = '#f59e0b';
                strengthText.textContent = 'Moderate password';
                strengthText.style.color = '#f59e0b';
            } else {
                strengthFill.style.width = '100%';
                strengthFill.style.backgroundColor = '#10b981';
                strengthText.textContent = 'Strong password';
                strengthText.style.color = '#10b981';
            }
        });

        // Camera Logic
        const startCameraButton = document.getElementById('startCamera');
        const capturePhotoButton = document.getElementById('capturePhoto');
        const registerButton = document.getElementById('registerButton');
        const camera = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const photoStatus = document.getElementById('photoStatus');
        const preview = document.getElementById('preview');
        const photoPlaceholder = document.getElementById('photoPlaceholder');

        let cameraStream = null;

        startCameraButton.addEventListener('click', async function () {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                camera.srcObject = cameraStream;
                camera.style.display = 'block';
                preview.style.display = 'none';
                photoPlaceholder.style.display = 'none';

                capturePhotoButton.disabled = false;
                capturePhotoButton.style.opacity = '1';
                capturePhotoButton.style.cursor = 'pointer';

                photoStatus.textContent = "Camera active. Look straight into the frame and click 'Capture Photo'.";
                photoStatus.style.color = '#38bdf8';
            } catch (error) {
                console.error("Error accessing camera:", error);
                photoStatus.textContent = "Error accessing camera. Please allow camera permissions.";
                photoStatus.style.color = '#ef4444';
            }
        });

        capturePhotoButton.addEventListener('click', function () {
            if (!cameraStream) return;

            canvas.width = camera.videoWidth || 640;
            canvas.height = camera.videoHeight || 480;
            const context = canvas.getContext('2d');

            context.drawImage(camera, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');

            preview.src = imageData;
            preview.style.display = 'block';
            camera.style.display = 'none';

            // Shut down webcam tracks
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;

            photoStatus.textContent = "Uploading captured photo...";
            photoStatus.style.color = '#f59e0b';

            canvas.toBlob(async function (blob) {
                const formData = new FormData();
                formData.append('photo', blob, 'photo.jpg');

                try {
                    const response = await fetch('/capture-photo', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (result.success === 'True' || result.success === true) {
                        if (result.photo_path) {
                            document.getElementById('photo_path').value = result.photo_path;
                        }
                        photoStatus.textContent = "Photo uploaded successfully. Ready to submit.";
                        photoStatus.style.color = '#10b981';

                        registerButton.disabled = false;
                        registerButton.style.opacity = '1';
                        registerButton.style.cursor = 'pointer';
                    } else {
                        photoStatus.textContent = "Upload failed: " + (result.message || 'Unknown error');
                        photoStatus.style.color = '#ef4444';
                    }
                } catch (error) {
                    console.error("Error uploading photo:", error);
                    photoStatus.textContent = "Network error while uploading photo.";
                    photoStatus.style.color = '#ef4444';
                }
            }, 'image/jpeg');
        });
    </script>
</body>

</html>
